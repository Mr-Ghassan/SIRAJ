<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>SIRAJ — Signature Transitions v1.0</title>
<!--
  SIRAJ Signature Transitions v1.0 — five deterministic, seekable transitions (window.seek(t), pure in t).
  ?type=silk-sweep|silk-fold|ribbon-pass|architectural-reveal|light-reveal   &fmt=16x9|9x16   &a=<plate> &b=<plate>
  Timing from Motion Tokens v1.0 (motion-system/tokens → transitions.<type>: level, duration, ease).
  Scenes A and B are the real project (motion-system/assets/plates — approved «سراج» renders). Silk is always real:
  filmed footage (06-SIRAJ-Silk/Footage) or photographs (06-SIRAJ-Silk/Stills). Light is light, never silk.
  AIR (client rule 2026-10-13): the silk moves because a breeze passes through it — footage speed follows the air
  field (SirajSilk.air), reveal edges ripple with it (SirajSilk.breathe), the silk flap drifts with it. One direction
  (right → left); the architecture never moves except for the 1.04 → 1.00 SETTLE of the photograph.
  Timeline: A holds 0.5 s → transition → B settles and holds 0.8 s.
-->
<script src="../lib/siraj-motion-tokens.js"></script>
<script src="../lib/siraj-motion.js"></script>
<script src="../lib/siraj-footage-track.js"></script>
<script src="../lib/siraj-footage.js"></script>
<script src="../lib/siraj-silk-engine.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #170608; }
  .scene, .layer, #rib { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene { overflow: hidden; }
  .scene img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; display: block; }
  #rib { object-fit: cover; z-index: 4; pointer-events: none; }
  #light { z-index: 5; mix-blend-mode: screen; pointer-events: none; }
  #flap, #shade { z-index: 3; pointer-events: none; }
  #flap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #shade { background: rgba(23,6,8,.45); }
</style>
</head>
<body>
<div class="scene" id="B"><img id="imgB" alt=""></div>
<div class="scene" id="A"><img id="imgA" alt=""></div>
<div class="layer" id="shade" style="display:none"></div>
<div class="layer" id="flap" style="display:none"><img id="flapImg" alt=""></div>
<video id="rib" muted playsinline></video>
<div class="layer" id="light"></div>
<script>
const M = SirajMotion, E = M.EASE, SK = SirajSilk, TOK = window.SIRAJ_MOTION_TOKENS;
const q = new URLSearchParams(location.search);
const TYPE = q.get('type') || 'silk-sweep';
const TR = TOK.transitions[TYPE];
if (!TR) throw new Error('unknown transition ' + TYPE);
const W = innerWidth, H = innerHeight, FMT = H > W ? '9x16' : '16x9';
const PL = '../../motion-system/assets/plates/SIRAJ_Plate_';
const DEF = { 'silk-sweep': ['Front-Day', 'Front-Night'], 'silk-fold': ['Corner-Day', 'Side-Night'], 'ribbon-pass': ['Side-Day', 'Corner-Night'], 'architectural-reveal': ['Front-Night', 'Corner-Day'], 'light-reveal': ['Corner-Night', 'Front-Day'] }[TYPE];
const imgA = document.getElementById('imgA'), imgB = document.getElementById('imgB');
imgA.src = PL + (q.get('a') || DEF[0]) + '_v1.0.jpg';
imgB.src = PL + (q.get('b') || DEF[1]) + '_v1.0.jpg';
const A = document.getElementById('A'), B = document.getElementById('B');
const flap = document.getElementById('flap'), shade = document.getElementById('shade'), light = document.getElementById('light');
document.getElementById('flapImg').src = SK.ASSET.drapeLumen(FMT);
const T0 = 0.5, DUR = TR.duration / 1000, EASE = E[TR.ease] || E.flow;
const rib = SirajFootage.ribbon(document.getElementById('rib'), { fmt: FMT });
const vid = rib.video;
const usesRibbon = ['silk-sweep', 'ribbon-pass', 'architectural-reveal'].includes(TYPE);
SK.placeFootage(vid, { rtl: true });   // scale 1: the measured footage track stays valid
// AIR: one breeze; a gentle gust carries the silk through the middle of the transition
const WIND = { level: 'breeze', gust: { at: T0 + DUR * 0.25, rise: 0.7, hold: 0.2, fall: 1.4 }, seed: 4 };
// footage progress = integral of the air speed over the transition window (so the silk travels with the air)
const STEP = 1 / 120, SPD = []; let acc = 0;
for (let u = T0; u <= T0 + DUR + 1e-9; u += STEP) { SPD.push(acc); acc += (0.55 + SK.air(u, WIND).v) * STEP; }
const airP = (t) => { if (t <= T0) return 0; if (t >= T0 + DUR) return 1; const f = (t - T0) / STEP, i = Math.floor(f); return M.lerp(SPD[i], SPD[Math.min(i + 1, SPD.length - 1)], f - i) / acc; };
window.ready = Promise.all([imgA, imgB, document.getElementById('flapImg')].map((i) => i.decode().catch(() => {})).concat(rib.ready));
const geo = { W, H, rtl: true };

window.seek = async (t) => {
  const pr = M.clamp((t - T0) / DUR), p = EASE(pr);
  A.style.cssText = ''; B.style.cssText = ''; flap.style.display = 'none'; shade.style.display = 'none'; light.style.background = 'none';
  SK.clearMask(A); SK.clearMask(B);
  let ribOn = false;
  if (TYPE === 'silk-sweep') {
    // a broad plane of real silk glides along the diagonal; B is uncovered behind its trailing edge
    if (pr > 0 && pr < 1) { ribOn = true; const r = await SK.sweep(rib, airP(t), { fmt: FMT }); SK.axisMask(A, r.trail - 0.02, { ...geo, feather: 90, invert: true }); }
    else if (pr >= 1) A.style.opacity = 0;
    SK.settle(imgB, t, T0 + DUR * 0.35, DUR, 1.04);
  } else if (TYPE === 'silk-fold') {
    // A folds away along a curved crease (lower start → upper end); the flap is photographed silk; B settles
    const k = SK.kOf(p, 0.12), F = SK.fold(W, H, k, { rtl: true });
    A.style.clipPath = pr >= 1 ? 'inset(100%)' : pr <= 0 ? 'none' : F.clipA;
    if (pr > 0 && pr < 1) {
      flap.style.display = 'block'; SK.axisBand(flap, F.flapFrom, F.flapTo, { ...geo, feather: 6 });
      SK.drift(document.getElementById('flapImg'), t, { W, level: 'breeze', gust: WIND.gust, seed: 6, extra: 'scaleX(-1) ' });
      shade.style.display = 'block'; SK.axisBand(shade, F.flapFrom - 0.08, F.flapFrom, { ...geo, feather: 60 }); shade.style.opacity = (Math.sin(Math.PI * pr) * 0.8).toFixed(3);
    }
    SK.settle(imgB, t, T0, DUR * 1.6, 1.04);
  } else if (TYPE === 'ribbon-pass') {
    // a slim real ribbon passes along the diagonal; B is revealed behind its mid-line (locked to the footage track)
    if (pr > 0 && pr < 1) { ribOn = true; const r = await SK.sweep(rib, airP(t), { fmt: FMT }); SK.axisMask(A, r.mid, { ...geo, feather: 70, invert: true }); }
    else if (pr >= 1) A.style.opacity = 0;
    SK.settle(imgB, t, T0 + DUR * 0.4, DUR, 1.04);
  } else if (TYPE === 'architectural-reveal') {
    // twelve architectural columns open from the centre outwards; the real ribbon flows through the opening
    const cols = 12, cw = W / cols; let d = '';
    for (let i = 0; i < cols; i++) {
      const dist = Math.abs(i + 0.5 - cols / 2) / (cols / 2);
      const k = E.reveal(M.clamp((pr - dist * 0.35) / 0.65)), w = cw * k, x = i * cw + (cw - w) / 2;
      if (w > 0.2) d += `M${x.toFixed(1)},0 h${w.toFixed(1)} v${H} h${(-w).toFixed(1)} Z`;
    }
    A.style.zIndex = 0; B.style.zIndex = 1;
    B.style.clipPath = pr >= 1 ? 'none' : `path('${d || 'M0,0'}')`;
    if (pr > 0 && pr < 1) { ribOn = true; await SK.sweep(rib, airP(t), { fmt: FMT }); vid.style.opacity = (Math.sin(Math.PI * pr) * 0.95).toFixed(3); }
    SK.settle(imgB, t, T0, DUR * 1.2, 1.04);
  } else if (TYPE === 'light-reveal') {
    // a warm band of light passes from the upper end; at its brightest it carries B in behind it; then fades
    const env = Math.sin(Math.PI * pr);
    SK.lightSweep(light, M.lerp(1.15, -0.15, p), env, { ...geo, width: 0.26, strength: 0.75, wash: 0.12 });
    if (pr > 0 && pr < 1) SK.axisMask(A, M.lerp(1.15, -0.15, p) + 0.04, { ...geo, feather: 260 });
    else if (pr >= 1) A.style.opacity = 0;
    SK.settle(imgB, t, T0 + DUR * 0.3, DUR, 1.04);
  }
  if (!ribOn) vid.style.display = 'none'; else { vid.style.display = 'block'; if (TYPE !== 'architectural-reveal') vid.style.opacity = 1; }
};
if (!navigator.webdriver) window.ready.then(() => { const t0 = performance.now(); const loop = async () => { await window.seek(((performance.now() - t0) / 1000) % (T0 + DUR + 0.8)); requestAnimationFrame(loop); }; loop(); });
</script>
</body>
</html>
