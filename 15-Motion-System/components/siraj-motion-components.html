<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>SIRAJ — Motion Component Library v1.0</title>
<!--
  SIRAJ Motion Component Library v1.0 — 16 deterministic, seekable compositions (window.seek(t), pure in t).
  ?c=logo-reveal|logo-close|title|subtitle|lower-third|stat|counter|property-reveal|image-reveal|map|location-marker|
     floor-plan|chart|cta|transition|end-card
  &fmt=16x9|9x16   &alpha=1 (overlay components: transparent background, for WebM alpha)
  &values=a,b,c    (stat / chart only: CONFIRMED figures; without them the data slots show «—»)

  Timing comes from Motion Tokens v1.0 (motion-system/tokens → lib/siraj-motion-tokens.js → components.<c>.timeline),
  so the documentation and the renders can never drift. Moving silk = real footage; static silk = photographs.
  Arabic only (RTL), Tajawal + Jost, Western digits. On-screen data: «مسقط»,
  «شقق سكنية ومحلات تجارية», the city «مسقط», 7771 4404 and the Instagram icon + SIRAJPROPERTIES (lib/siraj-public-data.js; never «@»). Nothing else is claimed.
-->
<link rel="stylesheet" href="../../09-Design-System/css/siraj.css">
<script src="../lib/siraj-motion-tokens.js"></script>
<script src="../lib/siraj-motion.js"></script>
<script src="../lib/siraj-public-data.js"></script>
<script src="../lib/siraj-logo-data.js"></script>
<script src="../lib/siraj-footage-track.js"></script>
<script src="../lib/siraj-footage.js"></script>
<script src="../lib/siraj-silk-engine.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #170608; color: #F7F2ED; }
  body.alpha, body.alpha #root { background: transparent !important; }
  #root { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; }
  .full { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ar { font-family: "SIRAJ Digits", "Tajawal", sans-serif; letter-spacing: 0 !important; }
  .lat { font-family: "Jost", sans-serif; direction: ltr; unicode-bidi: isolate; }
  .lum { display: inline-block; flex: none; background: #AA9180; transform: rotate(45deg); }
  /* a line that rises from behind its mask; the padding keeps Arabic marks inside the mask, so lines never touch */
  .mask { display: block; overflow: hidden; padding-block: .16em; }
  .mask > span { display: inline-block; will-change: transform; }
  .hair { height: 1px; background: rgba(170,145,128,.85); transform-origin: 100% 50%; }
  .num { font-variant-numeric: lining-nums tabular-nums; }
  video.rib { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .light { position: absolute; inset: 0; mix-blend-mode: screen; pointer-events: none; }
  img.plate, img.cut { position: absolute; max-width: none; display: block; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const M = SirajMotion, E = M.EASE, SK = SirajSilk, PUB = window.SIRAJ_PUBLIC, TOK = window.SIRAJ_MOTION_TOKENS;
const q = new URLSearchParams(location.search);
const C = q.get('c') || 'title', FMT = q.get('fmt') === '9x16' ? '9x16' : '16x9', V = FMT === '9x16', ALPHA = q.get('alpha') === '1';
const VALUES = (q.get('values') || '').split(',').filter(Boolean).map(Number).filter((n) => isFinite(n));
if (ALPHA) document.body.classList.add('alpha');
const W = innerWidth, H = innerHeight, U = Math.min(W, H) / 1080;      // type unit (1 at 1080 short side)
const MX = V ? 72 : 120;                                                // side margin
const SAFE_B = V ? 340 : 96, SAFE_T = V ? 250 : 96;                     // 9:16 keeps top 250 / bottom 340 free of copy
const root = document.getElementById('root');
const PLATE = '../../motion-system/assets/plates/SIRAJ_Plate_';
const TL = TOK.components[C];
if (!TL) throw new Error('unknown component ' + C);
const step = (el) => TL.timeline.find((s) => s.el === el) || { at: 0, level: 'emphasis', dur: TOK.level.emphasis.duration.s };
const OUT = TL.out;
const waits = [];
let seek = () => {};

// ---- helpers ---------------------------------------------------------------------------------------------
const el = (html, css = '', parent = root, cls = 'abs') => { const d = document.createElement('div'); d.className = cls; d.style.cssText = css; d.innerHTML = html; parent.appendChild(d); return d; };
const $ = (sel, p = root) => p.querySelector(sel);
const img = (src, cls, parent) => { const i = document.createElement('img'); i.className = cls; i.src = src; parent.appendChild(i); waits.push(i.decode().catch(() => {})); return i; };
const lum = (s, col = '#AA9180') => `<i class="lum" style="width:${s}px;height:${s}px;background:${col}"></i>`;
const AR = (txt, size, w = 400, lh = 1.6, col = 'inherit', extra = '') => `<div class="ar" style="font-size:${Math.round(size * U)}px;font-weight:${w};line-height:${lh};color:${col};${extra}">${txt}</div>`;
const LINE = (id, txt, size, w, col, lh = 1.3) => `<span class="mask"><span id="${id}" class="ar" style="font-size:${Math.round(size * U)}px;font-weight:${w};line-height:${lh};color:${col}">${txt}</span></span>`;
// The project's place name, set in Tajawal (no project-name lettering: postponed by the client 2026-10-13). h in type units.
const PLACE = (h, dark = true) => `<span class="ar" style="display:block;font-size:${Math.round(h * 0.62 * U)}px;font-weight:500;line-height:1.36;color:${dark ? '#F7F2ED' : '#2C0F12'}">${PUB.project.city_ar}</span>`;
// Instagram = icon + handle, never «@» (client rule 2026-10-13)
const IGH = `${(PUB.instagram_icon_svg || '').replace('<svg ', '<svg style="width:.9em;height:.9em;vertical-align:-.12em;margin-right:.4em" ')}${PUB.handle}`;
const contactLine = (size, col = '#D6C0B2') => `<div style="display:flex;align-items:center;gap:${Math.round(size * 0.75)}px;font:400 ${Math.round(size * U)}px/1.45 Jost;color:${col};letter-spacing:.04em;direction:rtl"><bdi dir="ltr" class="lat num" style="white-space:nowrap">${PUB.phone_display}</bdi>${lum(Math.round(size * 0.24 * U))}<bdi dir="ltr" class="lat">${IGH}</bdi></div>`;
// entrance (+ exit when the component has one) at the token level of a timeline step
function st(t, name, o = {}) {
  const s = step(name);
  const a = M.inAt(t, s.at + (o.delay || 0), s.level, { dur: s.span, i: o.i, distance: o.distance, blur: o.blur, scale: o.scale });
  return OUT ? M.mix(a, M.outAt(t, OUT.at, OUT.level, { i: o.i })) : a;
}
const show = (node, t, name, o) => M.apply(node, st(t, name, o));
// rise from behind a mask (REVEAL), with the step's level
function rise(node, t, name, o = {}) {
  const s = step(name), L = M.LEVEL[s.level];
  const k = M.seg(t, s.at + (o.i || 0) * L.stagger, s.span ?? L.dur, E.drape);
  const out = OUT ? M.seg(t, OUT.at + (o.i || 0) * L.stagger * 0.5, M.LEVEL[OUT.level].exit, E.release) : 0;
  node.style.transform = `translateY(${((1 - k) * 110 - out * 110).toFixed(2)}%)`;
}
// hairline drawing from the start side (right) or the centre
function draw(node, t, name, o = {}) {
  const s = step(name), L = M.LEVEL[s.level];
  const k = M.seg(t, s.at + (o.i || 0) * L.stagger, s.span ?? L.dur, E.flow);
  const out = OUT ? M.seg(t, OUT.at, M.LEVEL[OUT.level].exit, E.release) : 0;
  node.style.transform = o.vertical ? `scaleY(${k})` : `scaleX(${k})`;
  node.style.opacity = 1 - out;
}
// a plate (publish-ready render of «سراج») placed with object-fit: cover maths, so a cut-out can sit on it exactly
function plate(name, { pos = [0.5, 0.5], zoom = 1, parent = root, cut = false } = {}) {
  const cam = el('', 'inset:0;overflow:hidden', parent, 'full');
  if (ALPHA) return { cam, skip: true };
  const NW = 1920, NH = 2384, sc = Math.max(W / NW, H / NH) * zoom, w = NW * sc, h = NH * sc;
  const x = (W - w) * pos[0], y = (H - h) * pos[1];
  const geo = `left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${w.toFixed(1)}px;height:${h.toFixed(1)}px`;
  const p = img(`${PLATE}${name}_v1.0.jpg`, 'plate', cam); p.style.cssText = geo;
  return { cam, p, geo, cut: cut ? (() => { const c = img(`${PLATE}${name}_Cutout_v1.0.webp`, 'cut', cam); c.style.cssText = geo; return c; })() : null };
}
// the official wordmark (exact master geometry) — Sand on dark/photo, Maroon on light. Lumen stays Stone.
function logo(width, letter = '#D6C0B2', parent = root, css = '') {
  const B = window.SIRAJ_LOGO_BOX, h = width * B.h / B.w;
  const d = el(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${B.x} ${B.y} ${B.w} ${B.h}" width="${width}" height="${h}" style="display:block;overflow:visible">${window.SIRAJ_LOGO.map((p) => `<path d="${p.d}" fill="${p.role === 'lumen' ? '#AA9180' : letter}"/>`).join('')}</svg>`, `width:${width}px;height:${h}px;${css}`, parent);
  d.w = width; d.h = h; return d;
}
// logo resolve: curved-edge mask (start → end) + unblur + settle at the step's level
function resolveLogo(lg, t, name, { blur = 10, scale = 1.02 } = {}) {
  const s = step(name), L = M.LEVEL[s.level], dur = s.span ?? L.dur;
  const p = M.seg(t, s.at, dur, E.reveal);
  SK.maskReveal(lg, p, SK.breathe({ W: lg.w, H: lg.h, rtl: true, curve: 0.05, margin: 0.12 }, t, { level: 'whisper' }));
  const k = M.seg(t, s.at, dur * 1.15, E.drape);
  const out = OUT ? M.seg(t, OUT.at, M.LEVEL[OUT.level].exit, E.release) : 0;
  lg.style.filter = (1 - k) * blur > 0.02 ? `blur(${((1 - k) * blur).toFixed(2)}px)` : 'none';
  lg.style.transform = `scale(${(scale - (scale - 1) * k).toFixed(5)})`;
  lg.style.opacity = (M.clamp(p * 4) * (1 - out)).toFixed(4);
}
const dark = (css = '') => { if (!ALPHA) root.style.background = 'radial-gradient(ellipse 85% 95% at 26% 14%, #4A1C26 0%, #2C0F12 38%, #170608 72%, #0B0304 100%)'; };
const ivory = () => { if (!ALPHA) { root.style.background = '#F7F2ED'; root.style.color = '#3B3436'; } };

// ---- components -----------------------------------------------------------------------------------------
const COMP = {
  // 1 · LOGO REVEAL — real ribbon footage sweeps through; the wordmark is uncovered behind its trailing edge.
  'logo-reveal'() {
    dark();
    const glow = el('', `inset:0;background:radial-gradient(ellipse 60% 55% at 22% 12%, rgba(238,214,208,.16), rgba(238,214,208,0) 70%)`, root, 'full');
    const stage = el('', 'inset:0', root, 'full');
    const LW = Math.round(W * (V ? 0.6 : 0.34));
    const lg = logo(LW, '#D6C0B2', stage, `left:${(W - LW) / 2}px;top:${H / 2 - (LW * 28.11 / 98.163) / 2}px`);
    const vid = document.createElement('video'); vid.className = 'rib'; root.appendChild(vid);
    const rib = SirajFootage.ribbon(vid, { fmt: FMT }); waits.push(rib.ready);
    SK.placeFootage(vid, { rtl: true });
    seek = async (t) => {
      glow.style.opacity = M.seg(t, step('light').at, step('light').dur, E.flow);
      const s = step('silk'), p = M.seg(t, s.at, s.dur, E.linear);
      const r = p > 0 && p < 1 ? await SK.sweep(rib, p, { fmt: FMT }) : { trail: p >= 1 ? 1.2 : -0.2 };
      vid.style.opacity = p > 0 && p < 1 ? 1 : 0;
      // the logo is visible only where the silk has already passed — the ribbon never crosses the visible logo
      if (p >= 1) SK.clearMask(stage); else SK.axisMask(stage, r.trail - 0.02, { W, H, rtl: true, feather: 70 * U });
      const k = M.seg(t, step('logo').at, step('logo').dur, E.drape);
      lg.style.filter = (1 - k) * 12 > 0.02 ? `blur(${((1 - k) * 12).toFixed(2)}px)` : 'none';
      lg.style.transform = `scale(${(1.02 - 0.02 * k).toFixed(5)})`;
    };
  },

  // 2 · LOGO CLOSE — the picture dims toward the logo zone; the wordmark resolves bottom-right.
  'logo-close'() {
    const pl = plate('Front-Night', { pos: [0.5, 0.42] });
    const scrim = el('', `inset:0;background:radial-gradient(ellipse 70% 80% at 92% 96%, rgba(23,6,8,.82) 0%, rgba(23,6,8,.5) 40%, rgba(23,6,8,0) 75%)`, root, 'full');
    const LW = Math.round((V ? 300 : 320) * U);
    const lg = logo(LW, '#D6C0B2', root, `right:${MX}px;bottom:${(V ? SAFE_B : 104) * U}px`);
    const rule = el('', `right:${MX}px;bottom:${(V ? SAFE_B : 104) * U + lg.h + lg.h * 0.6}px;width:${Math.round(LW * 0.36)}px`, root); rule.className = 'abs hair';
    seek = (t) => {
      if (!pl.skip) SK.settle(pl.cam, t, 0, 4.0, 1.03);
      scrim.style.opacity = M.seg(t, step('scrim').at, step('scrim').dur, E.flow);
      resolveLogo(lg, t, 'logo', { blur: 8 });
      draw(rule, t, 'rule');
    };
  },

  // 3 · TITLE REVEAL — WRAP: a real ribbon passes behind the building (cut-out), the title rises from its masks.
  title() {
    const pl = V ? plate('Corner-Night', { pos: [0.5, 0.3] }) : plate('Side-Night', { pos: [0.5, 0.06], cut: true });
    let rib = null, vid = null;
    if (!V && !pl.skip) {
      vid = document.createElement('video'); vid.className = 'rib'; pl.cam.insertBefore(vid, pl.cut);
      rib = SirajFootage.ribbon(vid, { fmt: FMT }); waits.push(rib.ready);
      SK.placeFootage(vid, { rtl: true, scale: 1.15 });
      SK.wrap(pl.cut, 'behind');
    }
    el('', V ? 'inset:0;background:linear-gradient(0deg, rgba(23,6,8,.9) 0%, rgba(23,6,8,.62) 34%, rgba(23,6,8,0) 62%)'
             : 'inset:0;background:linear-gradient(270deg, rgba(23,6,8,.9) 0%, rgba(23,6,8,.66) 34%, rgba(23,6,8,0) 64%)', root, 'full');
    const size = V ? 100 : 112;
    const box = el(`<div id="eb" style="display:flex;align-items:center;gap:${16 * U}px">${lum(Math.round(11 * U))}${AR(PUB.project.city_ar, V ? 30 : 26, 500, 1.6, '#D6C0B2')}</div>
      <div style="margin-top:${22 * U}px">${LINE('l1', 'حين يحلّ المساء،', size, 200, '#F7F2ED')}${LINE('l2', 'يُضيء سراج.', size, 800, '#F7F2ED')}</div>
      <div class="hair" id="rule" style="width:${150 * U}px;margin-top:${34 * U}px"></div>`,
      V ? `right:${MX}px;left:${MX}px;bottom:${SAFE_B + 40}px` : `right:${MX}px;top:${H * 0.3}px;width:${W * 0.5}px`);
    seek = async (t) => {
      if (!pl.skip) SK.settle(pl.cam, t, 0, step('plate').dur, 1.06);
      if (rib) { const p = M.seg(t, 0.1, 3.9, E.linear); vid.style.opacity = p > 0 && p < 1 ? 1 : 0; if (p > 0 && p < 1) await SK.sweep(rib, p, { fmt: FMT }); }
      show($('#eb', box), t, 'eyebrow'); rise($('#l1', box), t, 'line1'); rise($('#l2', box), t, 'line2'); draw($('#rule', box), t, 'rule');
    };
  },

  // 4 · SUBTITLE — one calm line, bottom centre.
  subtitle() {
    const pl = plate('Front-Night', { pos: [0.5, 0.5] });
    const scrim = el('', 'inset:0;background:linear-gradient(0deg, rgba(23,6,8,.72) 0%, rgba(23,6,8,.38) 18%, rgba(23,6,8,0) 36%)', root, 'full');
    const s = el(AR('في قلب المدينة، بيتٌ من ضوء.', V ? 48 : 46, 400, 1.5, '#F7F2ED', 'text-align:center;text-shadow:0 1px 18px rgba(23,6,8,.45)'), `left:${MX}px;right:${MX}px;bottom:${(V ? SAFE_B + 40 : 92) * U}px`);
    seek = (t) => {
      if (!pl.skip) SK.settle(pl.cam, t, 0, 4.5, 1.03);
      scrim.style.opacity = M.seg(t, step('scrim').at, step('scrim').dur, E.flow) * (1 - M.seg(t, OUT.at + 0.2, M.LEVEL[OUT.level].exit, E.release));
      show(s, t, 'line');
    };
  },

  // 5 · LOWER THIRD — Deep plate with a Silk Corner opens from the start side; name and descriptor rise.
  'lower-third'() {
    const pl = plate('Corner-Day', { pos: [0.5, V ? 0.4 : 0.45] });
    el('', 'inset:0;background:linear-gradient(0deg, rgba(23,6,8,.45) 0%, rgba(23,6,8,0) 38%)', root, 'full');
    const lt = el(`<div id="pl" style="position:absolute;inset:0;background:rgba(44,15,18,.92);border-top-left-radius:${46 * U}px"></div>
      <div style="position:relative;display:flex;align-items:center;gap:${26 * U}px;padding:${26 * U}px ${46 * U}px ${26 * U}px ${56 * U}px">
        <span id="lm" style="display:inline-flex">${lum(Math.round(12 * U))}</span>
        <div><span class="mask"><span id="n" style="display:inline-block">${PLACE(V ? 92 : 84, true)}</span></span>${LINE('d', PUB.project.descriptor_ar, V ? 28 : 26, 400, '#D6C0B2', 1.5)}</div></div>`,
      `right:${MX}px;bottom:${(V ? SAFE_B + 40 : 112) * U}px`);
    const plEl = $('#pl', lt);
    seek = (t) => {
      if (!pl.skip) SK.settle(pl.cam, t, 0, 5, 1.03);
      const s = step('plate'), p = M.seg(t, s.at, s.dur, E.reveal), out = M.seg(t, OUT.at, M.LEVEL[OUT.level].exit * 1.3, E.release);
      const r = lt.getBoundingClientRect();
      if (out > 0) SK.maskReveal(lt, 1 - out, SK.breathe({ W: r.width, H: r.height, rtl: false, curve: 0.04 }, t)); else SK.maskReveal(lt, p, SK.breathe({ W: r.width, H: r.height, rtl: true, curve: 0.04 }, t));
      $('#lm', lt).style.opacity = M.seg(t, step('lumen').at, step('lumen').dur, E.drape);
      rise($('#n', lt), t, 'name'); rise($('#d', lt), t, 'line', { i: 0 });
    };
  },

  // 6 · STAT — data slots «—» until a figure is confirmed (&values=…). Hairlines draw, slots settle.
  stat() {
    ivory();
    const labels = ['شقق سكنية', 'محلات تجارية', 'المساحة (م²)'];
    const cols = labels.map((l, i) => `<div style="flex:1;${V ? `padding-block:${36 * U}px;${i ? 'border-top' : ''}` : `padding-inline:${44 * U}px;`}position:relative">
        ${i && !V ? `<div class="hair rl" style="position:absolute;right:0;top:0;bottom:0;width:1px;height:auto;transform-origin:50% 0"></div>` : ''}
        ${i && V ? `<div class="hair rl" style="position:absolute;right:0;left:0;top:0;transform-origin:100% 50%"></div>` : ''}
        <div class="mask"><span id="v${i}" class="num lat" style="font:200 ${Math.round((V ? 150 : 132) * U)}px/1.1 Jost;color:#602733;display:inline-block">${VALUES[i] !== undefined ? '0' : '—'}</span></div>
        <div id="l${i}">${AR(l, V ? 34 : 30, 400, 1.6, '#3B3436')}</div></div>`).join('');
    const box = el(`<div id="eb" style="display:flex;align-items:center;gap:${14 * U}px">${lum(Math.round(10 * U))}${AR(PUB.project.city_ar, V ? 30 : 26, 500, 1.6, '#602733')}</div>
      <div style="display:flex;${V ? 'flex-direction:column' : ''};margin-top:${(V ? 40 : 64) * U}px">${cols}</div>`,
      V ? `right:${MX}px;left:${MX}px;top:${SAFE_T + 120}px` : `right:${MX - 44 * U}px;left:${MX}px;top:${H * 0.3}px`);
    seek = (t) => {
      show($('#eb', box), t, 'eyebrow');
      box.querySelectorAll('.rl').forEach((r, i) => draw(r, t, 'rules', { i, vertical: !V }));
      labels.forEach((_, i) => {
        const v = $('#v' + i, box);
        if (VALUES[i] !== undefined) v.textContent = M.count(t, step('values').at + i * 0.09, 1.6, VALUES[i]);
        else { const k = M.seg(t, step('values').at + i * M.LEVEL.emphasis.stagger, M.LEVEL.emphasis.dur, E.reveal); v.style.clipPath = `inset(0 0 0 ${(1 - k) * 100}%)`; }
        rise(v, t, 'values', { i }); show($('#l' + i, box), t, 'labels', { i });
      });
    };
  },

  // 7 · COUNTER — odometer digits settle on the contact number (a real, non-claim value) over a real silk still.
  counter() {
    const bg = el('', 'inset:0;overflow:hidden', root, 'full');
    if (!ALPHA) { const s = img(SK.ASSET.drapeDeep(FMT), 'plate', bg); s.style.cssText = 'left:0;top:0;width:100%;height:100%;object-fit:cover'; bg.silk = s; el('', 'inset:0;background:rgba(23,6,8,.42)', root, 'full'); }
    const digits = PUB.phone.split('');   // shown in groups of four with a small space: 7771 4404
    const DS = Math.round((V ? 150 : 210) * U);
    const reel = (d, i) => `<div style="height:${DS * 1.1}px;overflow:hidden;display:inline-block"><div id="r${i}" style="display:flex;flex-direction:column">${Array.from({ length: 11 + +d }, (_, n) => `<span style="height:${DS * 1.1}px;line-height:${DS * 1.1}px">${n % 10}</span>`).join('')}</div></div>`;
    const box = el(`<div id="lb" style="display:flex;justify-content:center;align-items:center;gap:${14 * U}px">${lum(Math.round(10 * U))}${AR('للتواصل', V ? 34 : 30, 500, 1.6, '#D6C0B2')}</div>
      <div dir="ltr" class="num" style="margin-top:${18 * U}px;display:flex;justify-content:center;font:200 ${DS}px Jost;color:#F7F2ED;letter-spacing:-.01em">${digits.map((d, i) => reel(d, i) + (i === 3 ? `<span style="display:inline-block;width:${Math.round(DS * 0.28)}px"></span>` : '')).join('')}</div>
      <div id="hd" style="margin-top:${26 * U}px;font:300 ${Math.round(44 * U)}px/1.45 Jost;color:#D6C0B2;letter-spacing:.06em" dir="ltr">${IGH}</div>`, `left:0;right:0;top:${H * (V ? 0.34 : 0.24)}px;text-align:center`);
    seek = (t) => {
      if (!ALPHA) { SK.settle(bg, t, 0, step('plate').dur, 1.06); SK.drift(bg.silk, t, { W, level: 'whisper' }); } // AIR: the silk still is carried by a breeze
      show($('#lb', box), t, 'label');
      const s = step('digits');

  // 8 · PROPERTY REVEAL — the render is uncovered behind a real photographed ribbon riding the mask edge.
  'property-reveal'() {
    ivory();
    // 16:9 → photograph start-side, copy end-side · 9:16 → photograph on top, copy below (inside the safe zones)
    const PW = V ? W - 2 * MX : Math.round(780 * U), PH = V ? Math.round(H * 0.46) : H - 2 * 120 * U, PX = MX, PY = V ? SAFE_T : 120 * U;

      <div class="hair" id="rule" style="width:${160 * U}px;margin:${30 * U}px 0 ${26 * U}px"></div>
      <div id="ln">${AR('مدروسة في كل تفاصيلها.', 38, 200, 1.6, '#3B3436')}</div>`, V ? `right:${MX}px;left:${MX}px;top:${PY + PH + 56 * U}px` : `right:${MX}px;top:${H * 0.26}px;width:${W - PW - MX * 2 - 100 * U}px`);
    seek = (t) => {

  // 9 · IMAGE REVEAL — curved silk-edge mask from the lower start to the upper end, image settles 1.04 → 1.00.

  // 10 · MAP — an abstract line map (coast, roads), the camera glides in, the Lumen marker settles on «مسقط».
  map() {
    ivory();
    const cam = el('', 'inset:0;transform-origin:1010px 560px', root, 'full');
    const coast = 'M-40,430 C160,400 300,470 470,420 S760,300 930,330 S1210,250 1380,270 S1700,190 1980,150';

    </svg>`;
    const sea = el(AR('بحر عُمان', 28, 400, 1.6, '#6B625E'), `left:${300 * W / 1920}px;top:${180 * H / 1080}px;opacity:0`, cam);

      ${PLACE(96, false)}${AR(PUB.project.descriptor_ar, 40, 300, 1.45, '#3B3436')}`, `right:${MX}px;bottom:${110 * U}px;background:rgba(247,242,237,.94);padding:${26 * U}px ${34 * U}px;border-top-left-radius:${40 * U}px`);

  // 12 · FLOOR PLAN — hairline walls draw, rooms settle; areas are data slots «— م²» until confirmed.
  'floor-plan'() {
    ivory();
    // 9:16 → title block on top (below the safe zone), plan underneath across the full width
    const s = V ? (W - 2 * MX) / 16 : 58 * U, ox = V ? MX : MX + 40 * U, oy = V ? H * 0.47 : (H - 11 * s) / 2 - 20 * U;
    const walls = [[0, 0, 16, 0], [16, 0, 16, 11], [16, 11, 0, 11], [0, 11, 0, 0], [6, 0, 6, 6], [0, 6, 4.8, 6], [6, 6, 7.4, 6], [10.5, 0, 10.5, 4.5], [10.5, 6, 10.5, 11], [10.5, 6, 16, 6], [6, 6, 6, 8], [6, 9.4, 6, 11]];
    const rooms = [[13.25, 3, 'غرفة النوم'], [13.25, 8.5, 'الشرفة'], [8.25, 3, 'المعيشة'], [8.25, 8.5, 'الطعام'], [3, 3, 'غرفة النوم'], [3, 8.5, 'المطبخ']];
    const svg = el(`<svg width="${W}" height="${H}" style="position:absolute;inset:0">
      ${walls.map(([x1, y1, x2, y2], i) => `<line id="w${i}" x1="${ox + x1 * s}" y1="${oy + y1 * s}" x2="${ox + x2 * s}" y2="${oy + y2 * s}" stroke="#3B3436" stroke-width="${i < 4 ? 6 : 3.5}" stroke-linecap="square" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>`).join('')}
      <path id="arc" d="M${ox + 10.5 * s},${oy + 4.5 * s} A${1.5 * s},${1.5 * s} 0 0 1 ${ox + 9 * s},${oy + 6 * s}" fill="none" stroke="#AA9180" stroke-width="1.5" opacity="0"/>
      <path id="arc2" d="M${ox + 6 * s},${oy + 8 * s} A${1.4 * s},${1.4 * s} 0 0 0 ${ox + 7.4 * s},${oy + 9.4 * s}" fill="none" stroke="#AA9180" stroke-width="1.5" opacity="0"/>
      <g id="dim" opacity="0"><line x1="${ox}" y1="${oy + 11 * s + 44 * U}" x2="${ox + 16 * s}" y2="${oy + 11 * s + 44 * U}" stroke="#AA9180" stroke-width="1.5"/>
        <line x1="${ox}" y1="${oy + 11 * s + 34 * U}" x2="${ox}" y2="${oy + 11 * s + 54 * U}" stroke="#AA9180" stroke-width="1.5"/><line x1="${ox + 16 * s}" y1="${oy + 11 * s + 34 * U}" x2="${ox + 16 * s}" y2="${oy + 11 * s + 54 * U}" stroke="#AA9180" stroke-width="1.5"/></g></svg>`, 'inset:0', root, 'full');
    const labs = rooms.map(([x, y, n], i) => el(`${AR(n, 24, 400, 1.6, '#3B3436')}${AR('— م²', 20, 300, 1.6, '#6B625E')}`, `left:${ox + x * s - 90 * U}px;top:${oy + y * s - 34 * U}px;width:${180 * U}px;text-align:center;opacity:0`));
    const dimT = el(AR('— م', 20, 400, 1.6, '#6B625E'), `left:${ox + 8 * s - 60 * U}px;top:${oy + 11 * s + 52 * U}px;width:${120 * U}px;text-align:center;opacity:0`);
    const blk = el(`<div style="display:flex;align-items:center;gap:${14 * U}px">${lum(Math.round(10 * U))}${AR('المخطط', 26, 500, 1.6, '#602733')}</div>
      ${AR('النموذج —', 64, 300, 1.3, '#140E10', `margin-top:${10 * U}px`)}
      <div class="lat num" style="margin-top:${26 * U}px;font:200 ${Math.round(120 * U)}px/1.1 Jost;color:#602733;direction:rtl"><span class="ar" style="font-weight:200">— م²</span></div>
      ${AR('إجمالي المساحة', 28, 400, 1.6, '#3B3436')}`, `right:${MX}px;top:${V ? SAFE_T : H * 0.3}px`);
    seek = (t) => {
      walls.forEach((_, i) => $('#w' + i, svg).setAttribute('stroke-dashoffset', 1 - M.seg(t, step('walls').at + i * M.LEVEL.standard.stagger, step('walls').dur * 0.8, E.flow)));
      ['#arc', '#arc2'].forEach((a, i) => $(a, svg).setAttribute('opacity', M.seg(t, step('doors').at + i * 0.09, step('doors').dur, E.flow)));
      labs.forEach((l, i) => M.apply(l, M.inAt(t, step('rooms').at, 'emphasis', { i, distance: 12 * U })));
      $('#dim', svg).setAttribute('opacity', M.seg(t, step('dims').at, step('dims').dur, E.flow)); dimT.style.opacity = M.seg(t, step('dims').at + 0.1, step('dims').dur, E.flow);
      show(blk, t, 'block');

  // 13 · CHART — baseline + grid draw, bars rise and settle. Without confirmed data the bars are outlined slots «—».
  chart() {
    ivory();
    const n = 6, has = VALUES.length >= 2, data = has ? VALUES.slice(0, 8) : Array(n).fill(0.62), max = has ? Math.max(...data) * 1.15 : 1;
    const N = data.length, cw = W * 0.5, x0 = MX + 30 * U, y0 = H * 0.78, ch = H * 0.46, bw = cw / N * 0.52, gap = cw / N;
    const svg = el(`<svg width="${W}" height="${H}" style="position:absolute;inset:0">
      ${[0.25, 0.5, 0.75, 1].map((g, i) => `<line id="g${i}" x1="${x0}" x2="${x0 + cw}" y1="${y0 - g * ch}" y2="${y0 - g * ch}" stroke="#E3D6CC" stroke-width="1" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>`).join('')}
      <line id="base" x1="${x0}" x2="${x0 + cw}" y1="${y0}" y2="${y0}" stroke="#3B3436" stroke-width="1.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
      ${data.map((v, i) => `<rect id="b${i}" x="${x0 + i * gap + (gap - bw) / 2}" y="${y0}" width="${bw}" height="0" ${has ? `fill="${i === N - 1 ? '#602733' : '#D6C0B2'}"` : `fill="none" stroke="${i === N - 1 ? '#602733' : '#AA9180'}" stroke-width="1.5" stroke-dasharray="6 6"`}/>`).join('')}</svg>`, 'inset:0', root, 'full');
    const vals = data.map((v, i) => el(`<div class="lat num" style="font:300 ${Math.round(28 * U)}px/1.45 Jost;color:#3B3436">${has ? '' : '—'}</div>`, `left:${x0 + i * gap}px;width:${gap}px;text-align:center;top:0;opacity:0`));
    const cats = data.map((v, i) => el(AR('—', 22, 400, 1.6, '#6B625E'), `left:${x0 + i * gap}px;width:${gap}px;text-align:center;top:${y0 + 14 * U}px`));
    const blk = el(`<div style="display:flex;align-items:center;gap:${14 * U}px">${lum(Math.round(10 * U))}${AR(`${PUB.project.city_ar}`, 26, 500, 1.6, '#602733')}</div>
      ${AR('المؤشّر', 72, 300, 1.3, '#140E10', `margin-top:${10 * U}px`)}${AR('—', 30, 300, 1.6, '#6B625E', `margin-top:${12 * U}px`)}`, `right:${MX}px;top:${H * 0.3}px;width:${W * 0.3}px`);
    seek = (t) => {
      const g = step('grid');
      for (let i = 0; i < 4; i++) $('#g' + i, svg).setAttribute('stroke-dashoffset', 1 - M.seg(t, g.at + i * 0.06, g.dur, E.flow));
      $('#base', svg).setAttribute('stroke-dashoffset', 1 - M.seg(t, g.at, g.dur, E.flow));
      data.forEach((v, i) => {
        const k = M.seg(t, step('bars').at + i * M.LEVEL.hero.stagger, step('bars').dur, E.drape), h = (v / max) * ch * k;
        const r = $('#b' + i, svg); r.setAttribute('height', h.toFixed(2)); r.setAttribute('y', (y0 - h).toFixed(2));
        vals[i].style.top = (y0 - h - 52 * U) + 'px';
        M.apply(vals[i], M.inAt(t, step('values').at, 'emphasis', { i, distance: 10 * U }));
        if (has) vals[i].firstChild.textContent = M.count(t, step('bars').at + i * 0.12, step('bars').dur, v);
        cats[i].style.opacity = M.seg(t, g.at + 0.2, g.dur, E.flow);
      });
      show(blk, t, 'block');
    };
  },

    const scrim = el('', 'inset:0;background:linear-gradient(0deg, rgba(23,6,8,.8) 0%, rgba(23,6,8,.5) ' + (V ? 30 : 22) + '%, rgba(23,6,8,0) ' + (V ? 52 : 44) + '%)', root, 'full');

      draw(rule, t, 'rule'); resolveLogo(lg, t, 'logo', { blur: 8 });

  // 15 · TRANSITION — the in-edit cut: a curved edge carries B in along the Silk Axis; B settles.
  transition() {
    const A = plate('Side-Day', { pos: [0.5, 0.2] }), B = plate('Side-Night', { pos: [0.5, 0.2] });
    const shade = el('', 'inset:0;pointer-events:none', root, 'full');
    seek = (t) => {
      const s = step('edge'), p = M.seg(t, s.at, s.dur, E.reveal);
      SK.maskReveal(B.cam, p, SK.breathe({ W, H, rtl: true, curve: 0.04 }, t, { level: 'breeze' }));
      SK.settle(B.p, t, step('settle').at, step('settle').dur, 1.04);
      // a soft fold shadow travels just ahead of the edge (light and shadow, not silk)
      const k = SK.kOf(p); SK.axisBand(shade, k - 0.001, k + 0.06, { W, H, rtl: true, feather: 2 });
      shade.style.background = 'rgba(23,6,8,.28)'; shade.style.opacity = p > 0 && p < 1 ? Math.sin(Math.PI * p) : 0;
    };
  },

  // 16 · END CARD — a real silk horizon settles as a ground line; centred logo; contact line only.
  'end-card'() {
    dark();
    const hz = el('', 'inset:0;overflow:hidden', root, 'full');
    const h = img(SK.ASSET.horizon(FMT), 'cut', hz); h.style.cssText = 'left:0;top:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 100%';
    const LW = Math.round(W * (V ? 0.56 : 0.3));
    const LH = LW * 28.11 / 98.163, cy = H * (V ? 0.42 : 0.38);
    const lg = logo(LW, '#D6C0B2', root, `left:${(W - LW) / 2}px;top:${cy - LH / 2}px`);
    const rule = el('', `left:${W / 2 - 70 * U}px;top:${cy + LH / 2 + LH * 0.55}px;width:${140 * U}px;transform-origin:50% 50%`); rule.className = 'abs hair';
    const ct = el(contactLine(V ? 34 : 30), `left:0;right:0;top:${cy + LH / 2 + LH * 0.55 + 34 * U}px;display:flex;justify-content:center`);
    seek = (t) => {
      const s = step('silk'), k = M.seg(t, s.at, s.dur, E.glide), kk = M.seg(t, s.at, s.dur * 1.2, E.drape);
      SK.drift(h, t, { W, level: 'whisper', rtl: false, extra: `scaleX(-1) translateY(${((1 - k) * 14).toFixed(3)}%) scale(${(1.05 - 0.05 * kk).toFixed(5)}) ` }); // AIR (mirrored still → rtl:false keeps the drift right → left)
      h.style.opacity = M.seg(t, s.at, s.dur * 0.5, E.flow);
      resolveLogo(lg, t, 'logo', { blur: 12, scale: 1.02 });
      draw(rule, t, 'rule'); show(ct, t, 'contact');
    };
  },
};
