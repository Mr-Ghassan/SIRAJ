<!doctype html>
<html><head><meta charset="utf-8"><title>SIRAJ · Project Siraj hero post</title>
<!-- Project Siraj · city-centre hero post. Open with ?fmt=post|story&lang=ar|en
     Photo: SIRAJ_Project-Siraj_Hero_City_v1.0.jpg (graded with the SIRAJ Silk Grade). Silk: real silk photograph, SIRAJ Silk Horizon cut-out (06-SIRAJ-Silk/Stills/Alpha). -->
<link rel="stylesheet" href="../../../09-Design-System/css/siraj.css">
<style>
  html, body { margin: 0; background: #170608; }
  #art { position: relative; overflow: hidden; background: #170608; }
  #art.post { width: 1080px; height: 1350px; }
  #art.story { width: 1080px; height: 1920px; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .sky { position: absolute; left: 0; right: 0; top: 0; height: 44%; background: linear-gradient(180deg, rgba(247,242,237,.55), rgba(247,242,237,0)); }
  .fall { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(23,6,8,0) 0%, rgba(23,6,8,.3) 22%, rgba(23,6,8,.75) 44%, rgba(23,6,8,.94) 64%, #170608 100%); }
  #silk { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); display: block; filter: brightness(.74) saturate(.95); }
  .top { position: absolute; left: 72px; right: 72px; top: 72px; display: flex; justify-content: space-between; align-items: center; }
  .logo { height: 34px; display: block; }
  .eyebrow { font: 500 15px/1 Jost, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #602733; display: flex; align-items: center; gap: 12px; }
  .lumen { width: 8px; height: 8px; background: #AA9180; transform: rotate(45deg); display: inline-block; flex: none; }
  .head { position: absolute; left: 72px; right: 72px; margin: 0; font: 300 64px/1.08 Jost, sans-serif; letter-spacing: -.01em; color: #2C0F12; }
  .bottom { position: absolute; left: 72px; right: 72px; bottom: 64px; color: #F7F2ED; }
  .name { display: flex; align-items: baseline; gap: 18px; margin: 0 0 22px; }
  .name b { font: 300 76px/1 Jost, sans-serif; color: #F7F2ED; }
  .name span { font: 500 15px/1 Jost, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #D6C0B2; }
  .headB { margin: 0 0 26px; font: 300 44px/1.15 Jost, sans-serif; color: #F7F2ED; }
  [dir=rtl] .headB { font: 500 44px/1.5 'SIRAJ Digits', Tajawal, sans-serif; }
  .rule { height: 1px; background: rgba(214,192,178,.45); margin: 0 0 20px; }
  .foot { display: flex; justify-content: space-between; align-items: center; font: 400 17px/1 Jost, sans-serif; letter-spacing: .06em; color: #D6C0B2; }
  .foot b { font-weight: 500; color: #F7F2ED; }
  .disc { margin-top: 14px; font: 400 11px/1.3 Jost, sans-serif; letter-spacing: .04em; color: rgba(214,192,178,.7); }
  [dir=rtl] .eyebrow { font: 500 19px/1 'SIRAJ Digits', Tajawal, sans-serif; letter-spacing: 0; }
  [dir=rtl] .head { font: 500 66px/1.4 'SIRAJ Digits', Tajawal, sans-serif; letter-spacing: 0; }
  [dir=rtl] .name { align-items: center; }
  [dir=rtl] .name b { font: 500 84px/1.2 'SIRAJ Digits', Tajawal, sans-serif; }
  [dir=rtl] .name span { font: 500 20px/1 'SIRAJ Digits', Tajawal, sans-serif; letter-spacing: 0; }
  [dir=rtl] .foot { font: 400 19px/1 'SIRAJ Digits', Tajawal, sans-serif; letter-spacing: 0; }
  [dir=rtl] .disc { font: 400 13px/1.3 'SIRAJ Digits', Tajawal, sans-serif; letter-spacing: 0; }
  .ltr { direction: ltr; unicode-bidi: isolate; font-family: Jost, sans-serif; letter-spacing: .06em; }
  .ig { width: .92em; height: .92em; vertical-align: -0.13em; margin-inline-end: .38em; display: inline-block; }
</style>
</head><body>
<div id="art"><img class="photo" alt="">
  <div class="fall"></div><img id="silk" alt="">
  <div class="top"><img class="logo" src="../../../01-Logos/SVG/SIRAJ_Logo_Primary_v1.0.svg" alt="SIRAJ"><div class="eyebrow"></div></div>
  <h1 class="head"></h1>
  <div class="bottom"><div class="name"></div><p class="headB"></p><div class="rule"></div><div class="foot"></div><div class="disc"></div></div>
</div>
<script src="../../../11-Social/Templates/brand-data.js"></script>
<script>
const q = new URLSearchParams(location.search);
// Posts show phone + Instagram icon + handle only (no «@», no website).
const CT = window.SIRAJ_BRAND.contact;
const PH = `<b class="ltr">${CT.phone_display}</b>`;
const fmt = q.get('fmt') || 'post', lang = q.get('lang') || 'ar';
const art = document.getElementById('art'); art.className = fmt;
if (lang === 'ar') art.setAttribute('dir', 'rtl');
const T = {
  ar: { eyebrow: 'مسقط', head: 'في قلب المدينة،<br>بيتٌ من ضوء.', name: '<span>شقق سكنية ومحلات تجارية</span>',
        foot: `<span>سجّل اهتمامك · ${PH}</span><span class="ltr">${CT.social_icon_svg}${CT.social_handle}</span>`,
        disc: 'تصوّر معماري للمشروع.' },
  en: { eyebrow: 'Muscat', head: 'In the heart of the city,<br>a home of light.', name: '<b>Siraj</b><span>Muscat</span>',
        foot: `<span>Register your interest · ${PH}</span><span class="ltr">${CT.social_icon_svg}${CT.social_handle}</span>`,
        disc: 'Architectural visualisation.' },
}[lang];
const L = { post: { head: null, pos: q.get('pos') || '50% 50%', fall: 520, silk: 300 }, story: { head: 200, pos: q.get('pos') || '50% 50%', fall: 640, silk: 420 } }[fmt];
document.querySelector('.photo').src = q.get('img') || (fmt === 'story' ? 'SIRAJ_Project-Siraj_Hero_City_9x16_v1.0.jpg' : 'SIRAJ_Project-Siraj_Hero_City_4x5_v1.0.jpg');
document.querySelector('.photo').style.objectPosition = L.pos;
document.querySelector('.eyebrow').innerHTML = `<span class="lumen"></span>${T.eyebrow}`;
const head = document.querySelector('.head'), headB = document.querySelector('.headB');
if (L.head) { head.innerHTML = T.head; head.style.top = L.head + 'px'; headB.remove(); } else { headB.innerHTML = T.head.replace('<br>', ' '); head.remove(); }
document.querySelector('.name').innerHTML = T.name;
document.querySelector('.foot').innerHTML = T.foot;
document.querySelector('.disc').remove(); // no side notes on designs (client rule 2026-10-12)
document.querySelector('.fall').style.height = L.fall + 'px';

// SIRAJ Silk · Horizon: a real silk surface becomes the ground line the building stands on
const silk = document.getElementById('silk');
silk.src = `../../../06-SIRAJ-Silk/Stills/Alpha/SIRAJ_Silk_Horizon-Alpha_${fmt === 'story' ? '9x16' : '16x9'}_v1.0.png`;
silk.style.width = (fmt === 'story' ? 1080 : 1400) + 'px';
const loaded = (i) => (i.complete ? Promise.resolve() : new Promise((r) => (i.onload = r)));
Promise.all([loaded(document.querySelector('.photo')), loaded(silk)]).then(() => Promise.all([...document.images].map((i) => i.decode().catch(() => {})))).then(() => (window.ready = true));
</script>
</body></html>
