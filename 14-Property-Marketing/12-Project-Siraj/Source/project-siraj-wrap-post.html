<!doctype html>
<html><head><meta charset="utf-8"><title>SIRAJ · Project Siraj silk wrap post</title>
<!-- Project Siraj · Silk Wrap key visual. Open with ?fmt=post|story&lang=ar|en
     Photo: SIRAJ_Project-Siraj_Wrap_{4x5|9x16}_v1.0.jpg (AI-assisted CGI, enhanced with tools/keyvisual-enhance.py). No milky overlays: type sits in the sky and on a deep Shadow fall. -->
<link rel="stylesheet" href="../../../09-Design-System/css/siraj.css">
<style>
  html, body { margin: 0; background: #170608; }
  #art { position: relative; overflow: hidden; background: #170608; }
  #art.post { width: 1080px; height: 1350px; }
  #art.story { width: 1080px; height: 1920px; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .fall { position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, rgba(23,6,8,0) 0%, rgba(23,6,8,.08) 12%, rgba(23,6,8,.26) 24%, rgba(23,6,8,.55) 36%, rgba(23,6,8,.8) 48%, rgba(23,6,8,.94) 62%, #170608 80%); }
  .top { position: absolute; left: 72px; top: 68px; direction: ltr; }
  .logo { height: 36px; display: block; }
  .eyebrow { font: 500 15px/1 Jost, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #602733; display: flex; align-items: center; gap: 12px; }
  .lumen { width: 8px; height: 8px; background: #AA9180; transform: rotate(45deg); display: inline-block; flex: none; }
  .bottom { position: absolute; left: 72px; right: 72px; bottom: 60px; color: #F7F2ED; }
  .kicker { display: flex; align-items: center; gap: 12px; font: 500 15px/1 Jost, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #D6C0B2; margin: 0 0 18px; }
  .name { font: 300 92px/1 Jost, sans-serif; letter-spacing: -.01em; color: #F7F2ED; margin: 0 0 28px; }
  .head { margin-top: -14px !important; }
  .head { font: 300 40px/1.2 Jost, sans-serif; color: #D6C0B2; margin: 14px 0 28px; }
  .skyhead { position: absolute; left: 72px; right: 72px; top: 190px; margin: 0; font: 300 66px/1.1 Jost, sans-serif; letter-spacing: -.01em; color: #2C0F12; }
  [dir=rtl] .skyhead { font: 500 68px/1.35 'SIRAJ Digits', Tajawal, sans-serif; letter-spacing: 0; }
  .rule { height: 1px; background: linear-gradient(90deg, #AA9180, rgba(170,145,128,.15)); margin: 0 0 20px; }
  [dir=rtl] .rule { background: linear-gradient(270deg, #AA9180, rgba(170,145,128,.15)); }
  .foot { display: flex; justify-content: space-between; align-items: center; font: 400 17px/1 Jost, sans-serif; letter-spacing: .06em; color: #D6C0B2; }
  .foot b { font-weight: 500; color: #F7F2ED; }
  .disc { margin-top: 14px; font: 400 11px/1.3 Jost, sans-serif; letter-spacing: .04em; color: rgba(214,192,178,.6); }
  [dir=rtl] .eyebrow, [dir=rtl] .kicker { font: 500 19px/1 'SIRAJ Digits', Tajawal, sans-serif; letter-spacing: 0; }
  [dir=rtl] .name { font: 500 104px/1.05 'SIRAJ Digits', Tajawal, sans-serif; letter-spacing: 0; }
  [dir=rtl] .head { font: 400 42px/1.5 'SIRAJ Digits', Tajawal, sans-serif; }
  [dir=rtl] .foot { font: 400 19px/1 'SIRAJ Digits', Tajawal, sans-serif; letter-spacing: 0; }
  [dir=rtl] .disc { font: 400 13px/1.3 'SIRAJ Digits', Tajawal, sans-serif; letter-spacing: 0; }
  .ltr { direction: ltr; unicode-bidi: isolate; font-family: Jost, sans-serif; letter-spacing: .06em; }
  .ig { width: .92em; height: .92em; vertical-align: -0.13em; margin-inline-end: .38em; display: inline-block; }
</style>
</head><body>
<div id="art"><img class="photo" alt=""><div class="fall"></div>
  <div class="top"><img class="logo" src="../../../01-Logos/SVG/SIRAJ_Logo_Primary_v1.0.svg" alt="SIRAJ"></div>
  <div class="bottom"><div class="kicker"></div><h1 class="name"></h1><p class="head"></p><div class="rule"></div><div class="foot"></div><div class="disc"></div></div>
</div>
<script src="../../../11-Social/Templates/brand-data.js"></script>
<script>
const q = new URLSearchParams(location.search);
// Posts show phone + Instagram icon + handle only (no «@», no website).
const CT = window.SIRAJ_BRAND.contact;
const PH = `<b class="ltr">${CT.phone_display}</b>`;
const fmt = q.get('fmt') || 'post', lang = q.get('lang') || 'ar';
const art = document.getElementById('art'); art.className = fmt;
if (lang === 'ar') art.setAttribute('dir', 'rtl');
const T = {
  ar: { eyebrow: 'مسقط', kicker: 'شقق سكنية ومحلات تجارية', name: 'مسقط', head: 'حريرٌ وضوء، في قلب المدينة.',
        foot: `<span>سجّل اهتمامك · ${PH}</span><span class="ltr">${CT.social_icon_svg}${CT.social_handle}</span>`,
        disc: 'تصوّر معماري للمشروع.' },
  en: { eyebrow: 'Muscat', kicker: 'Muscat', name: 'Siraj', head: 'In the heart of the city, a home of light.',
        foot: `<span>Register your interest · ${PH}</span><span class="ltr">${CT.social_icon_svg}${CT.social_handle}</span>`,
        disc: 'Architectural visualisation.' },
}[lang];
const L = { post: { fall: 600 }, story: { fall: 820 } }[fmt];
const img = document.querySelector('.photo');
img.src = q.get('img') || `SIRAJ_Project-Siraj_Wrap_${fmt === 'story' ? '9x16' : '4x5'}_v1.0.jpg`;
img.style.objectPosition = q.get('pos') || '50% 50%';
document.querySelector('.kicker').innerHTML = `<span class="lumen"></span>${T.kicker}`;
document.querySelector('.name').innerHTML = T.name;
if (fmt === 'story') {
  const h = document.createElement('h2'); h.className = 'skyhead'; h.innerHTML = T.head.replace('، ', '،<br>').replace(', ', ',<br>');
  art.appendChild(h); document.querySelector('.head').remove();
} else document.querySelector('.head').textContent = T.head;
document.querySelector('.foot').innerHTML = T.foot;
document.querySelector('.disc').remove(); // no side notes on designs (client rule 2026-10-12)
document.querySelector('.fall').style.height = L.fall + 'px';
(img.complete ? Promise.resolve() : new Promise((r) => (img.onload = r))).then(() => Promise.all([...document.images].map((i) => i.decode().catch(() => {})))).then(() => (window.ready = true));
</script>
</body></html>
