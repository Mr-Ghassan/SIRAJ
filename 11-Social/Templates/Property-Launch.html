<!doctype html>
<html><head><meta charset="utf-8"><title>SIRAJ Social — Property Launch</title>
<link rel="stylesheet" href="../../09-Design-System/css/siraj.css">
<link rel="stylesheet" href="social.css">
<!-- Template data: edit the copy below. Contact and project facts come from
     00-Brand-Foundation/brand.config.json through {tokens} (see README). Open with
     ?format=post|square|story|reel|carousel|li|x&lang=en|ar(&slide=n) -->
<script id="data" type="application/json">{
  "name": "Property-Launch",
  "exports": {
    "post": [
      "en",
      "ar"
    ],
    "square": [
      "en",
      "ar"
    ],
    "story": [
      "en",
      "ar"
    ],
    "li": [
      "en",
      "ar"
    ],
    "x": [
      "en",
      "ar"
    ]
  },
  "layout": "hero",
  "env": "photo",
  "photo": "Residential-Tower-Golden-Hour",
  "pos": "50% 0%",
  "overlay": "horizon",
  "display": true,
  "cw": 0.84,
  "en": {
    "eyebrow": "Now launching",
    "title": "{noor.en}",
    "lead": "A residence shaped by light and silence in {noor.location_en}.",
    "blocks": [
      {
        "type": "facts",
        "items": [
          "{noor.units} residences",
          "{noor.floors} floors",
          "From OMR {n:noor.from_price_omr}"
        ]
      }
    ],
    "end": "{contact.post_line}"
  },
  "ar": {
    "eyebrow": "إطلاق جديد",
    "title": "{noor.ar}",
    "lead": "مساكن تتشكّل بالضوء والسكينة في {noor.location_ar}.",
    "blocks": [
      {
        "type": "facts",
        "items": [
          "{noor.units} وحدة سكنية",
          "{noor.floors} طابقاً",
          "ابتداءً من {n:noor.from_price_omr} ر.ع."
        ]
      }
    ],
    "end": "{contact.post_line}"
  },
  "formats": {
    "square": {
      "en": {
        "lead": ""
      },
      "ar": {
        "lead": ""
      }
    },
    "li": {
      "layout": "split",
      "env": "deep",
      "pos": "50% 20%",
      "anchor": "bottom",
      "media": {
        "w": 0.44
      },
      "en": {
        "lead": ""
      },
      "ar": {
        "lead": ""
      }
    },
    "x": {
      "layout": "split",
      "env": "deep",
      "pos": "50% 20%",
      "anchor": "bottom",
      "media": {
        "w": 0.44
      }
    }
  }
}</script>
</head><body><script src="brand-data.js"></script><script src="social.js"></script></body></html>
