<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SIRAJ — Compliments slip · Bilingual</title>
<link rel="stylesheet" href="../css/siraj-print.css">
<script src="../../../19-Templates/docs/js/brand-config.js"></script>
<script src="../../../19-Templates/docs/js/siraj-doc.js" defer></script>
<style>
  /* DL 210 × 99 mm — one third of A4. Wordmark centred; English from the left, Arabic from the right,
     joined by a Silk Line (the one signature element). Margins 15 mm. */
  .slip .face { --m: 15mm; }
  .slip .word { position: absolute; top: 13mm; left: calc(50% - 15mm); width: 30mm; }
  .slip .greet { position: absolute; top: 38mm; font-size: 17pt; font-weight: 300; line-height: 1.2; color: var(--d-ink-strong); letter-spacing: -0.005em; }
  .slip .greet.en { left: var(--m); }
  .slip .greet.ar { right: var(--m); direction: rtl; font-family: var(--f-arabic); font-weight: 400; font-size: 17pt; line-height: 1.3; top: 37mm; }
  .slip .silk { position: absolute; top: 33mm; left: 72mm; width: 66mm; height: 16.5mm; }
  .slip .foot { position: absolute; left: var(--m); right: var(--m); bottom: 8mm; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; column-gap: 4mm; font-size: 6pt; line-height: 3.2mm; color: var(--d-ash); }
  .slip .foot b { display: block; font-weight: 500; font-size: 5.2pt; letter-spacing: 0.16em; text-transform: uppercase; color: var(--d-maroon); }
  .slip .foot [lang="ar"] { direction: rtl; text-align: right; font-size: 7pt; line-height: 3.6mm; }
  .slip .foot [lang="ar"] b { font-size: 6.5pt; letter-spacing: 0; }
  .slip .rule { position: absolute; left: var(--m); right: var(--m); bottom: 23.5mm; border-top: 0.5pt solid var(--d-rule); }
  .slip .rule::before { content: ""; position: absolute; left: calc(50% - 0.7mm); top: -0.95mm; width: 1.4mm; height: 1.4mm; background: var(--d-stone); transform: rotate(45deg); }
</style>
</head>
<body data-preview-eyebrow="SIRAJ · Stationery · Compliments slip"
      data-preview-title="Compliments slip — Bilingual · DL 210 × 99 mm"
      data-preview-note="Uncoated warm-white 120 gsm, to match the letterhead. The Silk Line joins the English and Arabic greetings."
      data-preview-cols="1">

<section class="sheet slip" data-w="210" data-h="99" data-bleed="3" data-label="Compliments slip · Bilingual">
  <div class="art"><div class="face">
    <img class="word" src="../../../01-Logos/SVG/SIRAJ_Logo_Primary_v1.0.svg" alt="SIRAJ">
    <div class="greet en" lang="en">With compliments</div>
    <img class="silk" src="../../../05-Graphic-System/SVG/SIRAJ_Silk-Line_Stone_v1.0.svg" alt="">
    <div class="greet ar" lang="ar">مع أطيب التحيات</div>
    <div class="rule"></div>
    <div class="foot">
      <div><b>{{company.name_en}}</b>{{contact.address_en}}</div>
      <div><b>Contact</b>T {{contact.phone_display}} · <bdi dir="ltr" data-ig>{{contact.social_handle}}</bdi><br><bdi class="web">{{contact.website_display}}</bdi></div>
      <div lang="ar"><b>تواصل</b>هاتف <bdi dir="ltr">{{contact.phone_display}}</bdi> · <bdi dir="ltr" data-ig>{{contact.social_handle}}</bdi><br><bdi class="web">{{contact.website_display}}</bdi></div>
      <div lang="ar"><b>{{company.name_ar}}</b>{{contact.address_ar}}</div>
    </div>
  </div></div>
</section>

</body>
</html>
