<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SIRAJ — Official Brand Intro v1.0</title>
<!--
  SIRAJ Brand Intro v1.0 — 6.0 s
  0.0  Near darkness. A warm light source breathes in at the upper right (the lamp — سراج).
  0.3  A maroon silk ribbon enters from the lower start along the 51° Silk Axis; light travels across it.
  1.5  The ribbon crosses the frame; behind its passage the official wordmark is revealed (the silk never distorts the logo).
  3.6  The ribbon leaves through the upper end. The two Lumen diamonds ignite softly and settle.
  4.6  Final frame: official logo, strong negative space, stable composition (hold to 6.0).
  Query: ?fmt=16x9|9x16|1x1  &alpha=1 (transparent background)  &lockup=1 (adds bilingual descriptor)  &line=1 (proposed brand line)
  Driven deterministically by window.seek(t) — see tools/render-motion.js. Open in a browser to preview (auto-plays).
-->
<link rel="stylesheet" href="../../09-Design-System/css/siraj.css">
<script src="../../06-SIRAJ-Silk/engine/siraj-silk.js"></script>
<script src="../../15-Motion-System/lib/siraj-motion.js"></script>
<script src="../../15-Motion-System/lib/siraj-logo-data.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #030101; }
  body.alpha { background: transparent; }
  canvas, .layer { position: absolute; inset: 0; width: 100%; height: 100%; }
  #logo { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: visible; }
  .glow { position: absolute; width: 1px; height: 1px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
          background: radial-gradient(circle, rgba(226,207,195,.85) 0%, rgba(199,154,156,.35) 22%, rgba(129,64,76,.12) 48%, rgba(96,39,51,0) 70%); }
  .caption { position: absolute; left: 0; right: 0; text-align: center; color: #D6C0B2; }
  .caption .ar { font-family: "SIRAJ Digits", "Tajawal", sans-serif; font-weight: 400; }
  .caption .en { font-family: "Jost", sans-serif; font-weight: 400; letter-spacing: .32em; text-transform: uppercase; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<svg id="logo" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="g1" class="glow"></div><div id="g2" class="glow"></div>
<div class="caption" id="cap"><div class="ar" id="capAr">سراج للتطوير العقاري</div><div class="en" id="capEn">Real Estate Development</div></div>
<canvas id="fg"></canvas>
<script>
const M = SirajMotion, E = M.EASE;
const q = new URLSearchParams(location.search);
const FMT = q.get('fmt') || '16x9', ALPHA = q.get('alpha') === '1', LOCKUP = q.get('lockup') === '1', LINE = q.get('line') === '1';
if (ALPHA) document.body.classList.add('alpha');
if (LINE) { document.getElementById('capAr').textContent = 'نورٌ يُبنى'; document.getElementById('capEn').textContent = 'Light, built.'; }
const W = innerWidth, H = innerHeight, A = W / H;

// ---- official wordmark (exact paths; bbox 21.787,56.81 → 98.163 × 28.11) ------------------------------
const LOGO = window.SIRAJ_LOGO;
const BOX = { x: 21.787, y: 56.81, w: 98.163, h: 28.11 };
const LW = W * ({ '16x9': 0.40, '9x16': 0.66, '1x1': 0.56 }[FMT]);
const LH = LW * BOX.h / BOX.w;
const svg = document.getElementById('logo');
svg.setAttribute('viewBox', `${BOX.x} ${BOX.y} ${BOX.w} ${BOX.h}`);
svg.style.width = LW + 'px'; svg.style.height = LH + 'px';
svg.innerHTML = `<defs>
  <linearGradient id="wipe" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
  <mask id="m" maskUnits="userSpaceOnUse" x="${BOX.x - 20}" y="${BOX.y - 20}" width="${BOX.w + 40}" height="${BOX.h + 40}">
    <rect x="${BOX.x - 20}" y="${BOX.y - 20}" width="${BOX.w + 40}" height="${BOX.h + 40}" fill="#000"/>
    <path id="mp" fill="url(#wipe)"/>
  </mask></defs>
  <g mask="url(#m)">${LOGO.map((p, i) => `<path class="${p.role}" d="${p.d}" fill="${p.role === 'lumen' ? '#AA9180' : '#D6C0B2'}"/>`).join('')}</g>`;
const maskPath = document.getElementById('mp');
const wipe = document.getElementById('wipe');
const lumens = [...svg.querySelectorAll('.lumen')];

// glow positions (centre of each Lumen diamond in source units)
const toScreen = (x, y) => [W / 2 - LW / 2 + (x - BOX.x) / BOX.w * LW, H / 2 - LH / 2 + (y - BOX.y) / BOX.h * LH];
const G = [[47.75, 59.6], [117.49, 59.6]].map(([x, y]) => toScreen(x, y));
const glows = [document.getElementById('g1'), document.getElementById('g2')];

// caption (lockup / line) under the logo
const cap = document.getElementById('cap');
const capSize = LH * 0.2;
cap.style.top = (H / 2 + LH / 2 + LH * 0.75) + 'px';
document.getElementById('capAr').style.cssText = `font-size:${capSize * 1.25}px;line-height:1.3`;
document.getElementById('capEn').style.cssText = `font-size:${capSize * 0.62}px;margin-top:${capSize * 0.5}px`;
if (!LOCKUP && !LINE) cap.style.display = 'none';

// ---- silk: background light + travelling ribbon ------------------------------------------------------
const bg = new SirajSilk(document.getElementById('bg'), { background: 'transparent' });
const fg = new SirajSilk(document.getElementById('fg'), { background: 'transparent' });
[bg, fg].forEach((s) => { s.canvas.width = W; s.canvas.height = H; });
const PATHS = {
  '16x9': [[-1.55, -0.95, 0.3], [-0.95, -0.38, -0.2], [-0.4, 0.0, 0.4], [0.1, 0.08, -0.3], [0.6, 0.3, 0.3], [1.05, 0.72, 0], [1.6, 1.35, 0]],
  '9x16': [[-1.8, -0.7, 0.3], [-1.05, -0.3, -0.2], [-0.45, 0.0, 0.4], [0.15, 0.06, -0.3], [0.75, 0.22, 0.3], [1.3, 0.55, 0], [1.9, 0.95, 0]],
  '1x1':  [[-1.55, -1.0, 0.3], [-0.95, -0.4, -0.2], [-0.4, 0.0, 0.4], [0.1, 0.08, -0.3], [0.6, 0.3, 0.3], [1.05, 0.72, 0], [1.6, 1.35, 0]],
};
const RIB_W = { '16x9': 0.52, '9x16': 0.26, '1x1': 0.46 }[FMT];

window.seek = (t) => {
  // background: darkness → lamp light breathing in → settled deep maroon field
  const light = M.seg(t, 0.0, 2.6, E.flow);
  const settle = M.seg(t, 3.2, 2.2, E.drape);
  if (!ALPHA) {
    SirajSilk.BACKGROUNDS.custom = { type: 1, a: mix('#0A0304', '#5A2430', light), b: mix('#050102', '#3A141A', light), c: mix('#030101', '#1C080B', light), d: '#030101', at: [0.8 - 0.1 * settle, 0.84 - 0.08 * settle] };
    bg.set({ background: 'custom' });
    bg.render(t);
  }
  // ribbon: head travels along the spline; the visible length is 0.75 of the curve
  const head = M.lerp(0.0, 2.0, M.seg(t, 0.25, 3.9, E.glide));
  const u1 = M.clamp(head), u0 = M.clamp(head - 0.95);
  const lx = M.lerp(-0.6, 0.9, M.seg(t, 0.3, 3.8, E.linear));
  fg.set({
    background: 'transparent', light: [lx, 0.72, 0.6], exposure: 0.84,
    ribbons: u1 - u0 > 0.002 ? [{ points: PATHS[FMT], width: RIB_W, range: [u0, u1], fade: 0.08, twist: [0.9, 2.2, 0.7, 0.14], wave: [0.06, 1.1, 0.22], exposure: 1.2, segments: 460 }] : [],
  });
  fg.render(t);

  // logo reveal: a soft diagonal edge travelling with the ribbon (start → end), feathered like fabric edge
  const r = M.seg(t, 1.55, 1.7, E.flow);
  const x = BOX.x - 30 + r * (BOX.w + 60);
  const feather = 14;
  wipe.setAttribute('x1', x - feather); wipe.setAttribute('x2', x);
  maskPath.setAttribute('d', `M${BOX.x - 20},${BOX.y - 20} H${x + 10} C${x + 4},${BOX.y + 6} ${x - 6},${BOX.y + 20} ${x - 12},${BOX.y + BOX.h + 20} H${BOX.x - 20} Z`);
  // settle: imperceptible scale-down 1.03 → 1.00 (DRAPE)
  const s = 1.03 - 0.03 * M.seg(t, 1.4, 3.6, E.drape);
  svg.style.transform = `translate(-50%, -50%) scale(${s.toFixed(5)})`;

  // Lumen ignition: stone → sand glow → stone, with halo
  glows.forEach((g, i) => {
    const k = M.inOut(t, 3.55 + i * 0.12, 3.95 + i * 0.12, 4.15 + i * 0.12, 5.2 + i * 0.12, E.flow, E.drape);
    const size = LH * (0.9 + 0.6 * k);
    g.style.left = (G[i][0] - size / 2) + 'px'; g.style.top = (G[i][1] - size / 2) + 'px';
    g.style.width = g.style.height = size + 'px'; g.style.opacity = (k * 0.9).toFixed(3);
    lumens[i].setAttribute('fill', mix('#AA9180', '#E2CFC3', k * 0.85));
  });
  // caption
  const c = M.enter(t, 4.4, { dur: 0.9, distance: LH * 0.12 });
  cap.style.opacity = c.opacity; cap.style.transform = `translateY(${c.y}px)`; cap.style.filter = `blur(${c.blur}px)`;
};
function mix(a, b, k) {
  const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * k).toString(16).padStart(2, '0')).join('');
}
// live preview when opened directly
if (!navigator.webdriver) { const t0 = performance.now(); const loop = () => { window.seek(((performance.now() - t0) / 1000) % 6.5); requestAnimationFrame(loop); }; loop(); }
</script>
</body>
</html>
