<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SIRAJ — Official Brand Intro v1.0</title>
<!--
  SIRAJ Brand Intro v1.0 — 6.0 s
  0.0  Near darkness. A warm light source breathes in at the upper right (the lamp — سراج).
  0.3  A real maroon silk ribbon (filmed footage, 06-SIRAJ-Silk/Footage) enters from the lower start and glides toward the upper end.
  1.5  The ribbon crosses the frame; behind its passage the official wordmark is revealed (the silk never distorts the logo).
  3.6  The ribbon leaves through the upper end. The two Lumen diamonds ignite softly and settle.
  4.6  Final frame: official logo, strong negative space, stable composition (hold to 6.0).
  Variants: ?v=company (default — the SIRAJ wordmark) | v=project (the «مشروع سراج» silk-ribbon lettering is revealed,
  then a small SIRAJ wordmark and «مسقط» settle beneath it). Client rule 2026-10-13: a company intro and a project intro.
  Query: ?fmt=16x9|9x16|1x1  &alpha=1 (transparent background)  &lockup=1 (adds bilingual descriptor)  &line=1 (proposed brand line)
  AIR (client rule 2026-10-13): the breeze is what moves the silk. 0–1.5 s a whisper of air carries the dark silk
  surface while a warm light travels over it; the ribbon's speed follows the air, with one gentle gust as it uncovers
  the wordmark (≈ 1.6 s), then the air drops and everything SETTLES. One direction (right → left); no loops, no storm.
  Driven deterministically by window.seek(t) — see tools/render-motion.js. Open in a browser to preview (auto-plays).
-->
<link rel="stylesheet" href="../../09-Design-System/css/siraj.css">
<script src="../../15-Motion-System/lib/siraj-motion.js"></script>
<script src="../../15-Motion-System/lib/siraj-footage-track.js"></script>
<script src="../../15-Motion-System/lib/siraj-footage.js"></script>
<script src="../../15-Motion-System/lib/siraj-logo-data.js"></script>
<script src="../../15-Motion-System/lib/siraj-motion-tokens.js"></script>
<script src="../../15-Motion-System/lib/siraj-silk-engine.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #030101; }
  body.alpha { background: transparent; }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; }
  #rib { object-fit: cover; transform: scaleX(-1); }   /* mirrored: the air carries the silk right → left */
  #surf { object-fit: cover; opacity: 0; will-change: transform, opacity; }
  #sweep { mix-blend-mode: screen; opacity: 1; }
  #logo { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: visible; }
  .glow { position: absolute; width: 1px; height: 1px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
          background: radial-gradient(circle, rgba(226,207,195,.85) 0%, rgba(199,154,156,.35) 22%, rgba(129,64,76,.12) 48%, rgba(96,39,51,0) 70%); }
  .caption { position: absolute; left: 0; right: 0; text-align: center; color: #D6C0B2; }
  .caption .ar { font-family: "SIRAJ Digits", "Tajawal", sans-serif; font-weight: 400; }
  #plett { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; }
  #pmark { position: absolute; left: 0; right: 0; text-align: center; display: none; color: #D6C0B2; }
  #pmark img { display: block; margin: 0 auto; }
  #pmark .city { font-family: "SIRAJ Digits", "Tajawal", sans-serif; font-weight: 500; line-height: 1.5; }
  .caption .en { font-family: "Jost", sans-serif; font-weight: 400; letter-spacing: .32em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="bg" class="layer"></div>
<img id="surf" class="layer" alt=""><div id="sweep" class="layer"></div>
<svg id="logo" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="g1" class="glow"></div><div id="g2" class="glow"></div>
<img id="plett" alt="مشروع سراج"><div id="pmark"><img id="pmlogo" alt="SIRAJ"><div class="city">مسقط</div></div>
<div class="caption" id="cap"><div class="ar" id="capAr">سراج للتطوير العقاري</div><div class="en" id="capEn">Real Estate Development</div></div>
<video id="rib" class="layer" muted playsinline></video>
<script>
const M = SirajMotion, E = M.EASE;
const q = new URLSearchParams(location.search);
const FMT = q.get('fmt') || '16x9', ALPHA = q.get('alpha') === '1', LOCKUP = q.get('lockup') === '1', LINE = q.get('line') === '1';
if (ALPHA) document.body.classList.add('alpha');
if (LINE) { document.getElementById('capAr').textContent = 'نورٌ يُبنى'; document.getElementById('capEn').textContent = 'Light, built.'; }
const W = innerWidth, H = innerHeight, A = W / H;
const PROJECT = q.get('v') === 'project';

// ---- official wordmark (exact paths; bbox 21.787,56.81 → 98.163 × 28.11) ------------------------------
const LOGO = window.SIRAJ_LOGO;
const BOX = { x: 21.787, y: 56.81, w: 98.163, h: 28.11 };
const LW = W * ({ '16x9': 0.40, '9x16': 0.66, '1x1': 0.56 }[FMT]);
const LH = LW * BOX.h / BOX.w;
const svg = document.getElementById('logo');
svg.setAttribute('viewBox', `${BOX.x} ${BOX.y} ${BOX.w} ${BOX.h}`);
svg.style.width = LW + 'px'; svg.style.height = LH + 'px';
svg.innerHTML = `<defs>
  <linearGradient id="wipe" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <mask id="m" maskUnits="userSpaceOnUse" x="${BOX.x - 20}" y="${BOX.y - 20}" width="${BOX.w + 40}" height="${BOX.h + 40}">
    <rect x="${BOX.x - 20}" y="${BOX.y - 20}" width="${BOX.w + 40}" height="${BOX.h + 40}" fill="#000"/>
    <path id="mp" fill="url(#wipe)"/>
  </mask></defs>
  <g mask="url(#m)">${LOGO.map((p, i) => `<path class="${p.role}" d="${p.d}" fill="${p.role === 'lumen' ? '#AA9180' : '#D6C0B2'}"/>`).join('')}</g>`;
const maskPath = document.getElementById('mp');
const wipe = document.getElementById('wipe');
const lumens = [...svg.querySelectorAll('.lumen')];

// glow positions (centre of each Lumen diamond in source units)
const toScreen = (x, y) => [W / 2 - LW / 2 + (x - BOX.x) / BOX.w * LW, H / 2 - LH / 2 + (y - BOX.y) / BOX.h * LH];
const G = [[47.75, 59.6], [117.49, 59.6]].map(([x, y]) => toScreen(x, y));
const glows = [document.getElementById('g1'), document.getElementById('g2')];

// caption (lockup / line) under the logo
const cap = document.getElementById('cap');
const capSize = LH * 0.2;
cap.style.top = (H / 2 + LH / 2 + LH * 0.75) + 'px';
document.getElementById('capAr').style.cssText = `font-size:${capSize * 1.25}px;line-height:1.3`;
document.getElementById('capEn').style.cssText = `font-size:${capSize * 0.62}px;margin-top:${capSize * 0.5}px`;
if (!LOCKUP && !LINE) cap.style.display = 'none';

// ---- project variant: the silk-ribbon lettering «مشروع سراج» takes the wordmark's place --------------------
const plett = document.getElementById('plett'), pmark = document.getElementById('pmark');
const RIBBON = '../../01-Logos/Project/SIRAJ_Project-Siraj_Lettering_Ribbon-Ivory_v1.0.png';   // ivory satin ribbon on the dark intro
if (PROJECT) {
  svg.style.display = 'none'; glows.forEach((g) => (g.style.display = 'none'));
  plett.style.display = 'block'; pmark.style.display = 'block';
  const PW = W * ({ '16x9': 0.56, '9x16': 0.86, '1x1': 0.74 }[FMT]);
  plett.src = RIBBON; plett.style.width = PW + 'px';
  plett.style.top = (H * (FMT === '9x16' ? 0.45 : 0.44)) + 'px';
  const ML = W * (FMT === '9x16' ? 0.3 : 0.14);
  const ml = document.getElementById('pmlogo'); ml.src = '../../01-Logos/SVG/SIRAJ_Logo_Sand_v1.0.svg'; ml.style.width = ML + 'px';
  pmark.style.top = (H * (FMT === '9x16' ? 0.6 : 0.66)) + 'px';
  pmark.querySelector('.city').style.cssText = `font-size:${Math.round(ML * 0.13)}px;margin-top:${Math.round(ML * 0.12)}px`;
}

// ---- background light (a plain lamp glow, no graphics) + real silk ribbon footage ----------------------
const bgEl = document.getElementById('bg');
const rib = SirajFootage.ribbon(document.getElementById('rib'), { fmt: FMT });
// the ribbon's passage through the clip (seconds of footage) mapped onto intro time 0.25 → 4.15 s
const CLIP = SirajFootage.PASS[FMT];
// AIR: the silk surface (real photograph) and the ribbon's speed follow one breeze, right → left
const SK = window.SirajSilk;
const WIND = { level: 'whisper', gust: { at: 1.25, rise: 0.75, hold: 0.3, fall: 1.6 }, seed: 2 };
const surf = document.getElementById('surf'), sweepEl = document.getElementById('sweep');
if (!ALPHA) surf.src = SK.ASSET.drapeDeep(FMT === '9x16' ? '9x16' : '16x9'); else surf.remove();
// ribbon clip time = the integral of the air speed over the passage (0.25 → 4.15 s), normalised to the clip span
const PASS = [0.25, 4.15], STEP = 1 / 120, SPD = [];
let acc = 0; for (let u = PASS[0]; u <= PASS[1] + 1e-9; u += STEP) { SPD.push(acc); acc += (0.55 + SK.air(u, WIND).v) * STEP; }
const passK = (t) => { if (t <= PASS[0]) return 0; if (t >= PASS[1]) return 1; const f = (t - PASS[0]) / STEP, i = Math.floor(f); return M.lerp(SPD[i], SPD[Math.min(i + 1, SPD.length - 1)], f - i) / acc; };

window.ready = Promise.all([...document.images].filter((i) => i.getAttribute('src') || i.src).map((i) => i.decode().catch(() => {})).concat(rib.ready));

window.seek = async (t) => {
  // background: darkness → lamp light breathing in at the upper end → settled deep maroon field
  const light = M.seg(t, 0.0, 2.6, E.flow);
  const settle = M.seg(t, 3.2, 2.2, E.drape);
  if (!ALPHA) {
    const at = `${(80 - 6 * settle).toFixed(2)}% ${(16 + 6 * settle).toFixed(2)}%`;
    bgEl.style.background = `radial-gradient(ellipse 85% 95% at ${at}, ${mix('#0A0304', '#5A2430', light)} 0%, ${mix('#050102', '#3A141A', light)} 38%, ${mix('#030101', '#1C080B', light)} 72%, #030101 100%)`;
  }
  // silk surface in low light, carried by the air; a warm light travels over it, then it sinks into the dark
  if (!ALPHA) {
    const vis = M.inOut(t, 0, 0.9, 1.7, 3.0, E.flow, E.drape) * 0.6;
    surf.style.opacity = vis.toFixed(3);
    SK.drift(surf, t, { W, level: 'whisper', gust: WIND.gust, seed: WIND.seed, extra: `scale(${(1.06 - 0.03 * M.seg(t, 0, 3, E.drape)).toFixed(4)}) ` });
    SK.lightSweep(sweepEl, M.lerp(-0.15, 0.9, M.seg(t, 0.15, 2.6, E.glide)), M.inOut(t, 0.15, 0.9, 1.9, 2.8, E.flow, E.drape) * 0.55, { W, H, rtl: true, width: 0.22, strength: 0.2, wash: 0.03, color: '232,190,176' });
  }
  // ribbon: real footage; its speed follows the air (passage 0.25 → 4.15 s, gust ≈ 1.6 s)
  const k = passK(t);
  await rib.at(M.lerp(CLIP[0], CLIP[1], k));
  SK.carry(rib.video, SK.exitShift(FMT === '9x16' ? '9x16' : '16x9', k), { W, H, rtl: true });   // the air carries the ribbon out
  rib.video.style.opacity = t < 0.25 || t > 4.6 ? 0 : 1;

  // logo reveal: a soft diagonal edge travelling with the ribbon (start → end), feathered like fabric edge
  const r = M.seg(t, 1.55, 1.7, E.flow);
  const x = BOX.x - 30 + r * (BOX.w + 60);
  const feather = 14;
  // right → left with the silk (the air direction): the edge travels from the end (right) to the start (left)
  const xr = BOX.x + BOX.w + 30 - r * (BOX.w + 60);
  wipe.setAttribute('x1', xr); wipe.setAttribute('x2', xr + feather);
  maskPath.setAttribute('d', `M${BOX.x + BOX.w + 20},${BOX.y - 20} H${xr - 10} C${xr - 4},${BOX.y + 6} ${xr + 6},${BOX.y + 20} ${xr + 12},${BOX.y + BOX.h + 20} H${BOX.x + BOX.w + 20} Z`);
  if (PROJECT) {
    // the lettering is uncovered behind the ribbon along the same diagonal (feathered like a fabric edge)
    const rp = M.seg(t, 1.45, 1.9, E.flow);
    SK.axisMask(plett, M.lerp(-0.1, 1.1, rp), { W: plett.offsetWidth, H: plett.offsetHeight, rtl: true, feather: plett.offsetWidth * 0.08 });
    const ps = 1.03 - 0.03 * M.seg(t, 1.4, 3.8, E.drape);
    plett.style.transform = `translate(-50%, -50%) scale(${ps.toFixed(5)})`;
    const e = M.enter(t, 3.5, { dur: 1.1, distance: H * 0.012 });
    pmark.style.opacity = e.opacity; pmark.style.transform = `translateY(${e.y}px)`; pmark.style.filter = `blur(${e.blur}px)`;
  }
  // settle: imperceptible scale-down 1.03 → 1.00 (DRAPE)
  const s = 1.03 - 0.03 * M.seg(t, 1.4, 3.6, E.drape);
  svg.style.transform = `translate(-50%, -50%) scale(${s.toFixed(5)})`;

  // Lumen ignition: stone → sand glow → stone, with halo
  glows.forEach((g, i) => {
    const k = M.inOut(t, 3.55 + i * 0.12, 3.95 + i * 0.12, 4.15 + i * 0.12, 5.2 + i * 0.12, E.flow, E.drape);
    const size = LH * (0.9 + 0.6 * k);
    g.style.left = (G[i][0] - size / 2) + 'px'; g.style.top = (G[i][1] - size / 2) + 'px';
    g.style.width = g.style.height = size + 'px'; g.style.opacity = (k * 0.9).toFixed(3);
    lumens[i].setAttribute('fill', mix('#AA9180', '#E2CFC3', k * 0.85));
  });
  // caption
  const c = M.enter(t, 4.4, { dur: 0.9, distance: LH * 0.12 });
  cap.style.opacity = c.opacity; cap.style.transform = `translateY(${c.y}px)`; cap.style.filter = `blur(${c.blur}px)`;
};
function mix(a, b, k) {
  const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * k).toString(16).padStart(2, '0')).join('');
}
// live preview when opened directly
if (!navigator.webdriver) { const t0 = performance.now(); const loop = () => { window.seek(((performance.now() - t0) / 1000) % 6.5); requestAnimationFrame(loop); }; loop(); }
</script>
</body>
</html>
